<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra – MonAmour 🎨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page" style="padding-bottom:80px;">

  <h1 class="title" style="margin-top:16px;">Pizarra 🎨</h1>
  <p class="subtitle">Dibuja y comparte con tu persona 🐒</p>
  <div id="online-status" style="text-align:center; font-size:13px; margin-bottom:4px;"></div>

  <div class="card">
    <div class="tools">
      <div id="colors" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      <input type="range" id="size" min="2" max="30" value="5"
             style="width:80px; background:none; border:none; padding:0;">
      <button class="btn btn-pink" onclick="clearCanvas()">🗑 Limpiar</button>
      <button class="btn" onclick="guardar()">💾 Guardar</button>
    </div>
    <canvas id="drawCanvas" width="440" height="340"></canvas>
    <p id="save-ok" style="color:var(--brown-mid); font-weight:700; text-align:center; margin-top:8px; display:none;">
      ¡Dibujo guardado! 🎉
    </p>
  </div>

  <div class="card">
    <h2>Galería compartida 🖼</h2>
    <div id="galeria" style="display:flex; flex-wrap:wrap; gap:12px;"></div>
  </div>

</div>

<nav>
  <a href="home.html"><span class="icon">🏠</span>Inicio</a>
  <a href="carta.html"><span class="icon">💌</span>Cartas<span class="badge" id="carta-badge" style="display:none;"></span></a>
  <a href="dibujo.html" class="active"><span class="icon">🎨</span>Dibujos</a>
  <a href="juegos.html"><span class="icon">🎮</span>Juegos</a>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script>
  const session = requireAuth();
  const canvas  = document.getElementById('drawCanvas');
  const ctx     = canvas.getContext('2d');

  const COLORS = ['#4a2c17','#a0522d','#d4a574','#e8a0b4','#f5c6d0','#5b8a5e','#4a90d9','#e74c3c','#f39c12','#000000','#ffffff'];
  let currentColor = COLORS[0];
  let painting = false;
  let eraser   = false;

  // Paleta de colores
  const colorsDiv = document.getElementById('colors');
  COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (c === currentColor ? ' selected' : '');
    dot.style.background = c;
    if (c === '#ffffff') dot.style.border = '2px solid #ccc';
    dot.onclick = () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      currentColor = c;
      eraser = false;
      eraserBtn.style.opacity = '1';
    };
    colorsDiv.appendChild(dot);
  });

  const eraserBtn = document.createElement('button');
  eraserBtn.textContent = '🧹';
  eraserBtn.className = 'btn btn-pink';
  eraserBtn.style.padding = '6px 12px';
  eraserBtn.onclick = () => {
    eraser = !eraser;
    eraserBtn.style.opacity = eraser ? '0.5' : '1';
  };
  colorsDiv.appendChild(eraserBtn);

  // Helpers posición
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top)  * scaleY,
    };
  }

  // Dibujar localmente
  function drawStroke(x, y, color, size, isEraser, begin) {
    ctx.lineWidth  = isEraser ? size * 3 : size;
    ctx.lineCap    = 'round';
    ctx.strokeStyle = isEraser ? '#ffffff' : color;
    if (begin) { ctx.beginPath(); ctx.moveTo(x, y); }
    else { ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y); }
  }

  function startDraw(e) {
    painting = true;
    const { x, y } = getPos(e);
    drawStroke(x, y, currentColor, +document.getElementById('size').value, eraser, true);
  }

  function draw(e) {
    if (!painting) return;
    e.preventDefault();
    const { x, y } = getPos(e);
    const size = +document.getElementById('size').value;
    drawStroke(x, y, currentColor, size, eraser, false);
    // Emitir trazo al otro
    socket.emit('dibujo:stroke', { x, y, color: currentColor, size, eraser });
  }

  function stopDraw() { painting = false; ctx.beginPath(); }

  canvas.addEventListener('mousedown',  startDraw);
  canvas.addEventListener('mousemove',  draw);
  canvas.addEventListener('mouseup',    stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove',  draw,      { passive: false });
  canvas.addEventListener('touchend',   stopDraw);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    socket.emit('dibujo:clear');
  }

  function guardar() {
    socket.emit('dibujo:save', canvas.toDataURL('image/png'));
    const ok = document.getElementById('save-ok');
    ok.style.display = 'block';
    setTimeout(() => ok.style.display = 'none', 2500);
  }

  function renderGaleria(dibujos) {
    const cont = document.getElementById('galeria');
    if (!dibujos || dibujos.length === 0) {
      cont.innerHTML = '<p style="color:var(--brown-light); font-size:14px;">Todavía no hay dibujos 🎨</p>';
      return;
    }
    cont.innerHTML = [...dibujos].reverse().map(d => `
      <div style="text-align:center;">
        <div style="font-size:11px; color:var(--brown-light); margin-bottom:4px;">
          ${USERS[d.de].avatar} ${USERS[d.de].name} · ${formatDate(d.fecha)}
        </div>
        <img src="${d.dataUrl}"
             style="width:180px; height:140px; object-fit:cover; border-radius:12px; border:2px solid var(--pink-mid);">
      </div>`).join('');
  }

  let prevStroke = null;

  initSocket((sock) => {
    sock.on('init', ({ dibujos }) => renderGaleria(dibujos));
    sock.on('online', updateOnlineBadge);

    // Recibir trazo en tiempo real
    sock.on('dibujo:stroke', ({ x, y, color, size, eraser: isE }) => {
      drawStroke(x, y, color, size, isE, prevStroke === null);
      prevStroke = { x, y };
    });

    sock.on('dibujo:clear', () => ctx.clearRect(0, 0, canvas.width, canvas.height));

    sock.on('dibujo:new', (d) => {
      // Agregar a galería sin recargar todo
      const cont = document.getElementById('galeria');
      const placeholder = cont.querySelector('p');
      if (placeholder) cont.innerHTML = '';
      const div = document.createElement('div');
      div.style.textAlign = 'center';
      div.innerHTML = `
        <div style="font-size:11px; color:var(--brown-light); margin-bottom:4px;">
          ${USERS[d.de].avatar} ${USERS[d.de].name} · ${formatDate(d.fecha)}
        </div>
        <img src="${d.dataUrl}"
             style="width:180px; height:140px; object-fit:cover; border-radius:12px; border:2px solid var(--pink-mid);">`;
      cont.prepend(div);
    });
  });
</script>
</body>
</html>
