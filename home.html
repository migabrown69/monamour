<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio – MonAmour 🐒</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page" style="padding-bottom:80px;">

  <h1 class="title" style="margin-top:16px;">MonAmour 🌸</h1>
  <div class="deco-row">🐒 🍫 🌸 🍂 🐒 🍫 🌸</div>

  <div class="card" style="text-align:center;">
    <div class="user-badge" id="user-info" style="justify-content:center;"></div>
    <div id="online-status" style="margin-top:8px; font-size:14px;">⏳ Conectando...</div>
    <p id="welcome-msg" style="font-size:15px; margin-top:10px; line-height:1.7;"></p>
  </div>

  <div class="card">
    <h2>¿Qué hacemos hoy?</h2>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <a href="carta.html" class="btn btn-pink" style="text-align:center; text-decoration:none; display:block;">
        💌 Cartitas <span class="badge" id="home-badge" style="display:none;"></span>
      </a>
      <a href="dibujo.html" class="btn" style="text-align:center; text-decoration:none; display:block;">🎨 Pizarra de dibujos</a>
      <a href="juegos.html" class="btn btn-pink" style="text-align:center; text-decoration:none; display:block;">🎮 Jueguitos</a>
    </div>
  </div>

  <div class="card">
    <h2>Últimas cartitas</h2>
    <div class="scroll-area" id="preview-cartas">
      <p style="color:var(--brown-light); font-size:14px;">Conectando...</p>
    </div>
  </div>

  <button class="btn" style="margin:10px; background:var(--brown-light);" onclick="logout()">Salir 🚪</button>
</div>

<nav>
  <a href="home.html" class="active"><span class="icon">🏠</span>Inicio</a>
  <a href="carta.html"><span class="icon">💌</span>Cartas<span class="badge" id="carta-badge" style="display:none;"></span></a>
  <a href="dibujo.html"><span class="icon">🎨</span>Dibujos</a>
  <a href="juegos.html"><span class="icon">🎮</span>Juegos</a>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script>
  const session = requireAuth();
  let allCartas = [];

  document.getElementById('user-info').innerHTML = `
    <span class="avatar">${session.avatar}</span>
    <span>${session.name}</span>
  `;

  const mensajes = {
    el:   ['Hola monito, ¿qué vas a hacer hoy? 🐒', 'Mándale una cartita, seguro le alegras el día 💌'],
    ella: ['Hola chiqui, aquí estamos los dos 🌸', '¿Ya leíste sus cartitas? 💕'],
  };
  const msgs = mensajes[session.who];
  document.getElementById('welcome-msg').textContent = msgs[Math.floor(Math.random() * msgs.length)];

  function renderPreview(cartas) {
    allCartas = cartas;
    const noLeidas = cartas.filter(c => c.de !== session.who && !c.leida).length;

    ['home-badge','carta-badge'].forEach(id => {
      const el = document.getElementById(id);
      if (noLeidas > 0) { el.textContent = noLeidas; el.style.display = 'inline'; }
      else el.style.display = 'none';
    });

    const cont = document.getElementById('preview-cartas');
    const last3 = [...cartas].reverse().slice(0, 3);
    if (last3.length === 0) {
      cont.innerHTML = '<p style="color:var(--brown-light); font-size:14px;">Todavía no hay cartitas 🐒</p>';
    } else {
      cont.innerHTML = last3.map(c => `
        <div class="carta">
          <div class="carta-de">${USERS[c.de].avatar} ${USERS[c.de].name}</div>
          <div>${c.texto.substring(0, 80)}${c.texto.length > 80 ? '...' : ''}</div>
          <div class="carta-fecha">${formatDate(c.fecha)}</div>
        </div>
      `).join('');
    }
  }

  initSocket((sock) => {
    sock.on('init', ({ cartas }) => renderPreview(cartas));
    sock.on('carta:new', () => { /* badge se actualiza en carta:updated */ });
    sock.on('carta:updated', (cartas) => renderPreview(cartas));
    sock.on('online', updateOnlineBadge);
  });
</script>
</body>
</html>
